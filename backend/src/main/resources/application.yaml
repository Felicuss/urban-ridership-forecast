spring:
  application:
    name: tram-load-api
  main:
    banner-mode: off
  webflux:
    problemdetails:
      enabled: true
  data:
    redis:
      # память агента; без REDIS_URL агент хранит историю в процессе и в Redis не ходит
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 1s

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,application/geo+json,text/csv
    min-response-size: 2KB

tramload:
  artifacts:
    dir: ${TRAMLOAD_ARTIFACTS_DIR:../artifacts}
    scenario-cache-size: 256
  cors:
    allowed-origins: ${TRAMLOAD_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
  agent:
    # Ollama Cloud через OpenAI-совместимый API; ключ только из окружения (.env), в репозитории его нет
    llm-base-url: ${LLM_BASE_URL:https://ollama.com/v1}
    llm-api-key: ${LLM_API_KEY:}
    llm-model: ${LLM_MODEL:gpt-oss:120b}
    llm-timeout: 60s
    mcp-url: ${MCP_URL:http://localhost:8765/mcp}
    mcp-timeout: 20s
    redis-url: ${REDIS_URL:}
  news:
    # веб-версия канала Дептранса; пусто - только проверенный архив 2025 года
    live-url: ${NEWS_LIVE_URL:https://t.me/s/DtOperativno}
    refresh: 10m
    timeout: 6s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # Redis нужен только агенту: без него сервис прогноза здоров
      enabled: false

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html
