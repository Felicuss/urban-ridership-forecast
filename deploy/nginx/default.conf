# Балансировщик перед репликами api. Имя api раз в 10 секунд перерешивается через DNS Docker,
# поэтому docker compose up --scale api=N подхватывается без перезапуска nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8080 resolve;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # сжимает nginx, реплики на 2 vCPU тратят процессор только на расчёт
    gzip on;
    gzip_min_length 2048;
    gzip_types application/json application/problem+json application/geo+json text/csv;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";

    location /api/v1/export {
        # файл идёт клиенту по мере записи, без буфера на диске nginx
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://api;
    }

    location / {
        proxy_pass http://api;
    }
}
