# Шлюз: раздаёт интерфейс и проксирует API на реплики сервиса. Имя api раз в 10 секунд
# перерешивается через DNS Docker, поэтому docker compose up --scale api=N подхватывается без перезапуска.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8080 resolve;
    keepalive 64;
}

map $sent_http_content_type $static_cache {
    default "no-cache";
    ~*application/geo\+json "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # статика сжата заранее при сборке образа, ответы API сжимаются на лету:
    # реплики на 2 vCPU тратят процессор только на расчёт
    gzip_static on;
    gzip on;
    gzip_min_length 2048;
    gzip_types application/json application/problem+json application/geo+json text/csv application/javascript text/css;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # карта: стиль, тайлы, шрифты и спрайты OpenFreeMap; погода по районам: Open-Meteo; воркер карты из blob
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://archive-api.open-meteo.com; frame-ancestors 'none'; base-uri 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # исходный Host с портом: браузер шлёт Origin и в POST того же источника, и Spring сверяет его
    # со схемой, хостом и портом запроса. Без порта POST сценария считался кросс-доменным и получал 403
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";

    location /api/v1/export {
        # файл идёт клиенту по мере записи, без буфера на диске nginx
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://api;
    }

    location /api/ {
        proxy_pass http://api;
    }

    location ~ ^/(actuator|swagger-ui|webjars)/ {
        proxy_pass http://api;
    }

    location = /swagger-ui.html {
        proxy_pass http://api;
    }

    # файлы сборки с хэшем в имени не меняются: кэш на год
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control $static_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://archive-api.open-meteo.com; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
